name: Evaluación de Ejercicios

on:
  push:
    branches:
      - "*"
      - "!badges"

jobs:
  build:
    name: Evaluación
    runs-on: ubuntu-latest
    steps:
      - name: Preparando pruebas
        uses: actions/checkout@v2
        with:
          fetch-depth: 0 # otherwise, you will failed to push refs to dest repo

      # add id to action so outputs can be used
      - name: Resultado de las pruebas
        uses: education/autograding@v1
        id: autograder
        continue-on-error: true

    outputs:
      grading-score: ${{ steps.autograder.outputs.Points }}

  # job to build custom status badges
  build-badges:
    name: Publicación
    runs-on: ubuntu-latest
    if: always()
    needs: build
    steps:
      # need to checkout whole repo
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      # switch to badges branch
      - run: git checkout badges 2>/dev/null || git checkout -b badges

      # make dir for badges
      - name: make badges dir
        run: mkdir -p .github/badges

      # create points bar
      - name: make points bar
        uses: markpatterson27/points-bar@v1
        with:
          points: ${{ needs.build.outputs.grading-score }}
          path: ".github/badges/points-label.svg"
          type: "badge"
          label: "Calificación"

      # commit and push badge if score has changed
      - name: Commit and push badge
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add '.github/badges/points-label.svg'
          git commit -m "Add/Update badge" || exit 0
          git push origin badges
